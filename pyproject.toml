[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "brokkr"
version = "0.0.1"
description = "Shrink vision models for edge hardware, stress-test them, and make them say when they're unsure."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
# Minimum versions are the ones Brokkr has been tested with.
# Install the CPU-only PyTorch first: pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
dependencies = [
    "numpy>=2.2",
    "torch>=2.14",
    "torchvision>=0.29",
    "onnx>=1.23",
    "onnxruntime>=1.23",
    "onnxscript>=0.7",  # needed by torch.onnx.export
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
include = ["brokkr*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
